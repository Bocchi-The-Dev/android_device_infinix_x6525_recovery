name: OrangeFox 16 [OFRP]

on:
  workflow_dispatch:
    inputs:
      DEVICE_TREE:
        description: 'Custom Recovery Tree'
        required: true
        default: 'https://github.com/Mooments1/android_device_infinix_x6525_recovery'
      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch'
        required: true
        default: 'OFOX-16'
      DEVICE_NAME:
        description: 'Device codename (PRODUCT_DEVICE)'
        required: true
        default: 'X6525'
      DEVICE_PATH:
        description: 'Device path (relative to source root)'
        required: true
        default: 'device/infinix/X6525'
      BUILD_TARGET:
        description: 'Build target (image suffix is added automatically)'
        required: true
        default: 'vendorboot'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot
      LDCHECK:
        description: 'Use LDCHECK'
        required: false
        default: 'false'
        type: boolean
      LDCHECKPATH:
        description: 'Path of blobs to check for missing decryption dependencies'
        required: true
        default: 'system/bin/qseecomd'

jobs:
  build:
    name: Build OFRP 16 by ${{ github.actor }}
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FOX_ROOT: ${{ github.workspace }}/fox_16.0
      OUTPUT_DIR: ${{ github.workspace }}/fox_16.0/out/target/product/${{ inputs.DEVICE_NAME }}

    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Clean-up
      uses: rokibhasansagar/slimhub_actions@main

    - name: Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 16

    - name: Build Environment (JDK 17 for Android 16)
      run: |
        export DEBIAN_FRONTEND=noninteractive
        sudo apt update
        sudo apt install -y repo aria2 openjdk-17-jdk
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
        echo "PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH" >> $GITHUB_ENV
        java -version
        repo --version

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        max-size: "5G"

    - name: Set-up fox_16.0 source (minimal TWRP 16 manifest + OrangeFox 16)
      run: |
        mkdir -p ${{ env.FOX_ROOT }}
        cd ${{ env.FOX_ROOT }}
        git clone https://github.com/OrangeFox16/sync.git -b master
        cd sync
        ./orangefox_sync.sh --branch 16.0 --path ${{ env.FOX_ROOT }}

    - name: Clone Device Tree
      run: |
        cd ${{ env.FOX_ROOT }}
        git clone ${{ inputs.DEVICE_TREE }} -b ${{ inputs.DEVICE_TREE_BRANCH }} ./${{ inputs.DEVICE_PATH }}
        cd ${{ inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: Building OrangeFox 16
      run: |
        cd ${{ env.FOX_ROOT }}
        export USE_CCACHE=1
        export CCACHE_EXEC=/usr/bin/ccache
        export ALLOW_MISSING_DEPENDENCIES=true
        if [ -f build/soong/ui/build/sandbox_linux.go ]; then
          sed -i 's/return sandboxConfig\.working/return false/g' build/soong/ui/build/sandbox_linux.go
        fi
        source build/envsetup.sh
        lunch twrp_${{ inputs.DEVICE_NAME }}-eng
        mka adbd ${{ inputs.BUILD_TARGET }}image

    - name: Set Build Date
      run: |
        echo "BUILD_DATE=$(TZ=UTC date +%Y%m%d)" >> $GITHUB_ENV

    - name: Check if the recovery exists
      if: always()
      run: |
        img_file=$(find "${{ env.OUTPUT_DIR }}" -name "*vendor*.img" -print -quit)
        if [ -f "$img_file" ]; then
          echo "CHECK_IMG_IS_OK=true" >> $GITHUB_ENV
          echo "MD5_IMG=$(md5sum "$img_file" | cut -d ' ' -f 1)" >> $GITHUB_ENV
        else
          echo "Recovery out directory is empty."
        fi

    - name: Upload to Release
      if: env.CHECK_IMG_IS_OK == 'true'
      uses: softprops/action-gh-release@master
      with:
        files: |
          ${{ env.OUTPUT_DIR }}/OrangeFox*.img
        name: OrangeFox 16 for X6525 (unofficial)
        tag_name: ${{ github.run_id }}
        body: |
          OrangeFox Recovery Project - fox_16.0 (Android 16 base)

          For Infinix Smart 8 X6525

          Device tree: ${{ inputs.DEVICE_TREE }} @ ${{ inputs.DEVICE_TREE_BRANCH }}
          Device tree commit: ${{ env.COMMIT_ID }}

          Flash in vendor_boot with fastboot:

          `adb reboot fastboot`
          `fastboot flash vendor_boot /path/to/OFRP.img`
        prerelease: false

    - name: Run LDCheck
      if: inputs.LDCHECK == 'true'
      run: |
        cd tools
        mv -n libneeds ${{ env.OUTPUT_DIR }}/${{ inputs.DEVICE_NAME }}/recovery/root/
        mv -n ldcheck ${{ env.OUTPUT_DIR }}/${{ inputs.DEVICE_NAME }}/recovery/root/
        cd ${{ env.OUTPUT_DIR }}/${{ inputs.DEVICE_NAME }}/recovery/root
        python3 ldcheck -p system/lib64:vendor/lib64:system/lib:vendor/lib -d ${{ inputs.LDCHECKPATH }}
        echo "Done checking missing dependencies. Review, and reconfigure your tree."
      continue-on-error: true
